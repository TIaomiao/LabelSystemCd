name: Workstation CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workstation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/api/requirements.txt

      - name: Install JavaScript dependencies
        run: npm --prefix frontend ci

      - name: Install CVI API test dependencies
        run: python -m pip install -r apps/api/requirements.txt

      - name: Verify embedded workstation
        run: npm --prefix apps/web run build

      - name: Build main frontend
        run: npm --prefix frontend run build

      - name: Run focused CVI API regressions
        env:
          PYTHONPATH: tests
        run: >-
          python -m unittest
          tests.test_tissue_lge_primary
          tests.test_dicom_split_sax_import
          tests.test_lge_mvo_measurements
